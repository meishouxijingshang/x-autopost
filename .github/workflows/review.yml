name: Post review

# posts/ のファイルが追加・変更されたら、確認用Issueにプレビューを出す
on:
  push:
    paths:
      - "posts/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: post-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python review.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
